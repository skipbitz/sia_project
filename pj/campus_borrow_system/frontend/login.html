<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Login - Campus Borrowing System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-logo">
      <img src="/assets/CCALOGO.png" alt="logo" />
    </div>
    <h2>Welcome Back !</h2>
    <p class="muted">Sign in to continue to your Digital Borrowing and Returning</p>
    <form id="loginForm" class="auth-form">
      <label>Email
        <input name="username" type="text" placeholder="username@collegename.ac.in" required>
      </label>
      <label>Password
        <input name="password" type="password" required>
      </label>
      <button class="btn primary" type="submit">Login</button>
    </form>
    <p class="muted small">New User? <a href="register.html">Register Here</a></p>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
